<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy - AI Fitness Plan Generator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="card">
    <h1>FitBuddy</h1>
    <p class="subtitle">AI-powered 7-day workout &amp; nutrition plans, tailored to you.</p>

    <form action="/generate-workout" method="post">
      <div>
        <label for="username">Name</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div>
        <label for="user_id">User ID</label>
        <input type="text" id="user_id" name="user_id" required>
      </div>

      <div>
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="10" max="100" required>
      </div>

      <div>
        <label for="weight">Weight (kg)</label>
        <input type="text" id="weight" name="weight" required>
      </div>

      <div>
        <label for="goal">Fitness Goal</label>
        <select id="goal" name="goal" required>
          <option value="">Select a goal</option>
          <option value="weight loss">Weight loss</option>
          <option value="muscle gain">Muscle gain</option>
          <option value="flexibility">Flexibility</option>
          <option value="general fitness">General fitness</option>
          <option value="endurance">Endurance</option>
        </select>
      </div>

      <div>
        <label for="intensity">Workout Intensity</label>
        <select id="intensity" name="intensity" required>
          <option value="">Select intensity</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <button type="submit">Generate Plan</button>
    </form>
  </div>

  <a class="nav-link" href="/view-all-users">View all users (admin) →</a>
</body>
</html>
